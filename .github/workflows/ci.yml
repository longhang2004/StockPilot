name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: stockpilot_admin
          POSTGRES_PASSWORD: stockpilot_admin
          POSTGRES_DB: stockpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockpilot_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CSRF_SECRET: ci-csrf-secret-with-at-least-32-characters
      DATABASE_URL: postgresql://stockpilot_app:stockpilot_app@localhost:5432/stockpilot_test
      DEMO_MODE: true
      DEMO_ORGANIZATION_SLUG: stockpilot-demo
      MIGRATION_DATABASE_URL: postgresql://stockpilot_admin:stockpilot_admin@localhost:5432/stockpilot_test
      NODE_ENV: test
      SITE_URL: https://stockpilot.example
      QUEUE_REQUIRED: false
      WEB_ORIGIN: http://localhost:3000
      WEBHOOK_SIGNING_SECRET: ci-webhook-secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Archive safety: env files must never reach a backup archive.
      - run: python3 scripts/compress.py --self-test
      - run: psql "$MIGRATION_DATABASE_URL" -f infra/postgres/init.sql
      - run: pnpm db:generate
      - run: pnpm --filter @stockpilot/api exec prisma migrate deploy
      - run: pnpm db:seed
      # Dependabot lockfile updates arrive unformatted; the formatter is
      # deterministic, so normalizing the generated lockfile still enforces
      # the repo style without failing tool-generated PRs.
      - run: pnpm exec prettier --write pnpm-lock.yaml
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm typecheck:e2e
      - run: pnpm test:ops-guards
      - run: pnpm test:unit
      - run: pnpm --filter @stockpilot/api test:integration
      - name: Create isolated pg-boss database
        run: psql "$MIGRATION_DATABASE_URL" -c 'CREATE DATABASE stockpilot_queue'
      - name: Verify real pg-boss processing
        env:
          QUEUE_TEST_DATABASE_URL: postgresql://stockpilot_admin:stockpilot_admin@localhost:5432/stockpilot_queue
        run: pnpm --filter @stockpilot/api exec vitest run --maxWorkers=1 test/integration-queue.integration.spec.ts
      - run: pnpm --filter @stockpilot/api test:unit:coverage
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - name: Upload development Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-dev
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Supply-chain gate in its own job: fail on high/critical advisories in the
  # full dependency tree (production and development). Moderate/low findings
  # are surfaced by Dependabot instead of blocking merges. Kept separate from
  # `verify` so an advisory never hides migration, unit, integration, or E2E
  # results; both jobs still gate the deploy workflow's success condition.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  # Build and exercise the production images together. This job owns one
  # disposable Compose project and retains browser artifacts even when a test
  # only passes on retry.
  docker-build:
    runs-on: ubuntu-latest
    env:
      API_REVISION: ${{ github.sha }}
      WEB_REVISION: ${{ github.sha }}
      PRODUCTION_E2E_PORT: 4187
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build and run production-image browser acceptance
        run: pnpm test:e2e:production
      - name: Upload production Playwright report, traces, and container logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-production
          path: |
            playwright-report-production/
            test-results-production/
          if-no-files-found: ignore
          retention-days: 14
