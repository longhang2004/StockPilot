name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: stockpilot_admin
          POSTGRES_PASSWORD: stockpilot_admin
          POSTGRES_DB: stockpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockpilot_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CSRF_SECRET: ci-csrf-secret-with-at-least-32-characters
      DATABASE_URL: postgresql://stockpilot_app:stockpilot_app@localhost:5432/stockpilot_test
      DEMO_MODE: true
      DEMO_ORGANIZATION_SLUG: stockpilot-demo
      MIGRATION_DATABASE_URL: postgresql://stockpilot_admin:stockpilot_admin@localhost:5432/stockpilot_test
      NODE_ENV: test
      SITE_URL: https://stockpilot.example
      QUEUE_REQUIRED: false
      WEB_ORIGIN: http://localhost:3000
      WEBHOOK_SIGNING_SECRET: ci-webhook-secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Archive safety: env files must never reach a backup archive.
      - run: python3 scripts/compress.py --self-test
      # Supply-chain gate: fail on high/critical advisories in the full
      # dependency tree (production and development). Moderate/low findings
      # are surfaced by Dependabot instead of blocking merges.
      - run: pnpm audit --audit-level high
      - run: psql "$MIGRATION_DATABASE_URL" -f infra/postgres/init.sql
      - run: pnpm db:generate
      - run: pnpm --filter @stockpilot/api exec prisma migrate deploy
      - run: pnpm db:seed
      # Dependabot lockfile updates arrive unformatted; the formatter is
      # deterministic, so normalizing the generated lockfile still enforces
      # the repo style without failing tool-generated PRs.
      - run: pnpm exec prettier --write pnpm-lock.yaml
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm typecheck:e2e
      - run: pnpm test:unit
      - run: pnpm --filter @stockpilot/api test:integration
      - run: pnpm --filter @stockpilot/api test:unit:coverage
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Production container verification: both Dockerfiles must build from a
  # clean workspace without publishing images. Catches syntax errors and
  # dependency drift that unit tests cannot see.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build API production image
        run: docker build -f apps/api/Dockerfile -t stockpilot-api:ci .
      - name: Build web production image
        run: docker build -f apps/web/Dockerfile -t stockpilot-web:ci .
      - name: Verify images run as non-root
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' stockpilot-api:ci)" = "node"
          test "$(docker image inspect --format '{{.Config.User}}' stockpilot-web:ci)" = "node"
