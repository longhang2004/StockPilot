name: Render demo deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: render-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-and-deploy:
    name: Migrate Neon and optionally trigger Render
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check deployment secrets
        id: config
        shell: bash
        run: |
          if [[ -n "$MIGRATION_DATABASE_URL" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Migration and seed skipped: configure the MIGRATION_DATABASE_URL repository secret."
          fi

          if [[ -n "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "render_deploy_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "render_deploy_enabled=false" >> "$GITHUB_OUTPUT"
            echo "Render hook skipped: the Render main-branch auto-deploy remains enabled."
          fi

      - name: Normalize migration database URL
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          migration_url="$MIGRATION_DATABASE_URL"
          if [[ "$migration_url" == *"DATABASE_URL="* ]]; then
            migration_url="$(printf '%s\n' "$migration_url" | sed -nE "s/^[[:space:]]*DATABASE_URL[[:space:]]*=[[:space:]]*['\"]?([^'\"]+)['\"]?[[:space:]]*$/\1/p" | head -n 1)"
          fi

          migration_url="${migration_url/-pooler./.}"
          if [[ "$migration_url" != postgres://* && "$migration_url" != postgresql://* ]]; then
            echo "MIGRATION_DATABASE_URL must be a PostgreSQL URL or a DATABASE_URL assignment." >&2
            exit 1
          fi

          echo "::add-mask::$migration_url"
          printf 'DATABASE_URL=%s\n' "$migration_url" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        if: steps.config.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v6.0.10
        if: steps.config.outputs.enabled == 'true'
        with:
          version: 10.13.1

      - uses: actions/setup-node@v7
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.config.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        if: steps.config.outputs.enabled == 'true'
        run: pnpm db:generate

      - name: Apply production migrations
        if: steps.config.outputs.enabled == 'true'
        run: pnpm --filter @stockpilot/api exec prisma migrate deploy

      - name: Seed canonical demo fixture
        if: steps.config.outputs.enabled == 'true'
        run: pnpm db:seed

      - name: Trigger Render deploy
        if: >-
          steps.config.outputs.enabled == 'true' &&
          steps.config.outputs.render_deploy_enabled == 'true'
        shell: bash
        run: |
          separator='?'
          if [[ "$RENDER_DEPLOY_HOOK_URL" == *'?'* ]]; then
            separator='&'
          fi
          curl --fail --silent --show-error \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${RENDER_COMMIT_SHA}"
